<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Gallery</title>

    <script src="https://unpkg.com/@azure/msal-browser/lib/msal-browser.min.js"></script>
</head>
<body>

    <h1>Family Gallery</h1>
<-- TODO
 画像、動画のみを表示、サムネイル表示、サムネイル選択時に拡大表示、動画再生まで確認済み
-->
    <button id="loginButton">
        Microsoftでログイン
    </button>

    <button id="logoutButton" style="display:none;">
        ログアウト
    </button>

    <div id="breadcrumb"></div>
    <div id="fileList"></div>
    <div id="viewer"></div>
    <div id="userInfo"></div>
    <button id="backButton">
        ← 戻る
    </button>
    <button id="listFilesButton">
        ファイル一覧取得
    </button>

    <script src="gallery.js"></script>

    <div id="modal"
        style="
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.9);
            z-index:9999;
            text-align:center;
        ">
    </div>
</body>
</html>
