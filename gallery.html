<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Gallery</title>

    <script src="https://unpkg.com/@azure/msal-browser/lib/msal-browser.min.js"></script>
</head>
<body>

    <h1>Family Gallery</h1>
// TODO
// Familyフォルダ固定
// 画像・動画のみ表示
// サムネイル表示
// 現時点でとりあえずindex.htmlのコピーしたところ。
// gallery.html自体はコミット済み。このコメント入力版はコミットしていない。
    <button id="loginButton">
        Microsoftでログイン
    </button>

    <button id="logoutButton" style="display:none;">
        ログアウト
    </button>

    <div id="breadcrumb"></div>
    <div id="fileList"></div>
    <div id="userInfo"></div>
    <button id="backButton">
        ← 戻る
    </button>
    <button id="listFilesButton">
        ファイル一覧取得
    </button>

    <script>
        console.log("script start");

        const msalConfig = {
            auth: {
                clientId: "815ff81e-8462-4eb0-a444-5a63070a1425",
                authority: "https://login.microsoftonline.com/consumers",
                redirectUri: "https://kurokuro746.github.io/family-drive/"
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let folderPath = [];

        (async () => {

            await msalInstance.initialize();

            const response =
                await msalInstance.handleRedirectPromise();

            if (response) {
                showUser(response.account);
            }
        })();
       
        async function signIn() {

            try {

                await msalInstance.loginRedirect({
                    scopes: [
                        "User.Read",
                        "Files.Read",
                        "Files.ReadWrite"
                    ]
                });

            } catch (error) {

                console.error(error);

            }
        }

        async function signOut() {

            const account = msalInstance.getAllAccounts()[0];

            if (account) {

                await msalInstance.logoutPopup({
                    account: account
                });

            }

            location.reload();

        }
        function displayFiles(data) {
            console.log(data);
            let html = "<h2>OneDriveファイル一覧</h2><ul>";
            for (const item of data.value) {

                if (item.folder || item.remoteItem?.folder) {
                    const folderId = item.remoteItem?.id || item.id;
                    const driveId = item.remoteItem?.parentReference?.driveId || null;
                    console.log("selected folder");
if (item.name === "2024-03-03") {
    console.log(
        "name=", item.name,
        "id=", item.id,
        "driveId=", driveId,
        "remoteItem=", item.remoteItem
    );
}                    html += `
                        <li>
                            📁
                            <a href="#"
                               onclick="openFolder('${folderId}','${item.name}','${driveId}')">
                                ${item.name}
                            </a>
                        </li>
                    `;
                } else {
                    console.log("selected file");
                    html += `
                        <li>
                            📄
                            <a href="#"
                            onclick="openFile('${item.webUrl}')">
                                ${item.name}
                            </a>
                        </li>
                    `;
                }
            }
            html += "</ul>";
            document.getElementById("fileList").innerHTML =
                html;
        }
       
        async function listFiles() {
            console.log("listFiles start");
            folderPath = [
                {
                    id: null,
                    name: "ルート"
                }
            ];
            renderBreadcrumb();
            try {
                const account =
                    msalInstance.getAllAccounts()[0];
                const tokenResponse =
                    await msalInstance.acquireTokenSilent({
                        scopes: [
                            "Files.Read"
                        ],
                        account: account
                    });
                console.log("token取得成功");
                const response =
                    await fetch(
                        "https://graph.microsoft.com/v1.0/me/drive/root/children",
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    tokenResponse.accessToken
                            }
                        }
                    );
                const data = await response.json();
                displayFiles(data);
            } catch(error) {
                console.error(error);
            }
        }
        async function openFolder(folderId, folderName, driveId) {
            console.log("openFolder Start");
            folderPath.push({
                id: folderId,
                name: folderName
            });
            renderBreadcrumb();
            console.log(folderPath);
            try {
                const account =
                    msalInstance.getAllAccounts()[0];
                const tokenResponse =
                    await msalInstance.acquireTokenSilent({
                        scopes: ["Files.Read"],
                        account: account
                    });
                let url;
                if (driveId && driveId !== "null") {
                    url = `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${folderId}/children`;
                } else {
                    url = `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children`;
                }
                console.log ("url=", url);
                const response =
                    await fetch(url,
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    tokenResponse.accessToken
                            }
                        }
                    );
                console.log(response.status);
                const data = await response.json();
                console.log("response data1 =", data);
                displayFiles(data);
            } catch(error) {
                console.error(error);
            }
        }
        async function openFolderById(folderId) {
            try {
                const account =
                    msalInstance.getAllAccounts()[0];
                const tokenResponse =
                    await msalInstance.acquireTokenSilent({
                        scopes: ["Files.Read"],
                        account: account
                    });
                const response =
                    await fetch(
                        `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children`,
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    tokenResponse.accessToken
                            }
                        }
                    );
                console.log(response.status);
                const data = await response.json();
                console.log("response data2 =", data);
                displayFiles(data);
            } catch(error) {
                console.error(error);
            }
        }
        function renderBreadcrumb() {

            let html = "";

            for (let i = 0; i < folderPath.length; i++) {

                if (i > 0) {
                    html += " &gt; ";
                }

                html += `
                    <a href="#"
                    onclick="navigateToBreadcrumb(${i})">
                        ${folderPath[i].name}
                    </a>
                `;
            }

            document.getElementById("breadcrumb").innerHTML =
                html;
        }
        async function navigateToBreadcrumb(index) {
            folderPath = folderPath.slice(0, index + 1);
            const targetFolder =
                folderPath[folderPath.length - 1];

            if (targetFolder.id === null) {
                await listFiles();
                return;
            }
            await openFolderById(targetFolder.id);
            renderBreadcrumb();
        }
        async function goBack() {
            if (folderPath.length <= 1) {
                return;
            }
            folderPath.pop();
            renderBreadcrumb();
            const parentFolder =
                folderPath[folderPath.length - 1];
            if (parentFolder.id === null) {
                await listFiles();
                return;
            }
            await openFolderById(parentFolder.id);
        }
        function openFile(url) {
            window.open(url, "_blank");
        }
        function showUser(account) {

            document.getElementById("userInfo").innerHTML =
                `
                <p>ログイン中</p>
                <p>${account.username}</p>
                `;

            document.getElementById("loginButton").style.display =
                "none";

            document.getElementById("logoutButton").style.display =
                "inline";

        }

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length > 0) {

            showUser(accounts[0]);

        }

        document
            .getElementById("loginButton")
            .addEventListener("click", signIn);
        document
            .getElementById("logoutButton")
            .addEventListener("click", signOut);
        document
            .getElementById("listFilesButton")
            .addEventListener("click", listFiles);
        document
            .getElementById("backButton")
            .addEventListener("click", goBack);
    </script>

</body>
</html>
