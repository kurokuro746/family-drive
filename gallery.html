<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="https://unpkg.com/@azure/msal-browser/lib/msal-browser.min.js"></script>
</head>
<body>

    <h1>Family Gallery1</h1>
    <div id="accountArea">
        <span id="userInfo"></span>
        <button id="loginButton">
            Microsoftでログイン
        </button>
        <button id="logoutButton">
            ログアウト
        </button>
    </div>
    <div id="navigation">
        <button id="backButton">← 戻る</button>
        <div id="breadcrumb"></div>
    </div>
    <div id="contentArea">
        <div id="fileList"></div>
    </div>
    <div id="viewer"></div>

    <script src="gallery.js"></script>

    <div id="modal"></div>
</body>
</html>
