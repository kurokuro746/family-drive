<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Drive</title>

    <script src="https://unpkg.com/@azure/msal-browser/lib/msal-browser.min.js"></script>
</head>
<body>

    <h1>Family Drive</h1>

    <button id="loginButton">
        Microsoftでログイン
    </button>

    <button id="logoutButton" style="display:none;">
        ログアウト
    </button>

    <div id="fileList"></div>

    <div id="userInfo"></div>

    <button id="backButton">
        ← 戻る
    </button>

    <button id="listFilesButton">
        ファイル一覧取得
    </button>

    <script>
        console.log("script start");

        const msalConfig = {
            auth: {
                clientId: "815ff81e-8462-4eb0-a444-5a63070a1425",
                authority: "https://login.microsoftonline.com/consumers",
                redirectUri: "https://kurokuro746.github.io/family-drive/"
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let folderPath = [];

        (async () => {

            await msalInstance.initialize();

            const response =
                await msalInstance.handleRedirectPromise();

            if (response) {
                showUser(response.account);
            }
        })();
       
        async function signIn() {

            try {

                await msalInstance.loginRedirect({
                    scopes: [
                        "User.Read",
                        "Files.Read",
                        "Files.ReadWrite"
                    ]
                });

            } catch (error) {

                console.error(error);

            }
        }

        async function signOut() {

            const account = msalInstance.getAllAccounts()[0];

            if (account) {

                await msalInstance.logoutPopup({
                    account: account
                });

            }

            location.reload();

        }

        function displayFiles(data) {
            let html = "<h2>OneDriveファイル一覧</h2><ul>";
            for (const item of data.value) {
                if (item.folder) {
                    html += `
                        <li>
                            📁
                            <a href="#"
                               onclick="openFolder('${item.id}','${item.name}')">
                                ${item.name}
                            </a>
                        </li>
                    `;
                } else {
                    html += `
                        <li>
                            📄 ${item.name}
                        </li>
                    `;
                }
            }
            html += "</ul>";
            document.getElementById("fileList").innerHTML =
                html;
        }
       
        async function listFiles() {
            console.log("listFiles start");
            folderPath = [
                {
                    id: null,
                    name: "ルート"
                }
            ];
            try {
                const account =
                    msalInstance.getAllAccounts()[0];
                const tokenResponse =
                    await msalInstance.acquireTokenSilent({
                        scopes: [
                            "Files.Read"
                        ],
                        account: account
                    });
                console.log("token取得成功");
                const response =
                    await fetch(
                        "https://graph.microsoft.com/v1.0/me/drive/root/children",
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    tokenResponse.accessToken
                            }
                        }
                    );
                const data = await response.json();
                displayFiles(data);
            } catch(error) {

                console.error(error);
            }
        }

        async function openFolder(folderId, folderName) {
            folderPath.push({
                id: folderId,
                name: folderName
            });
            console.log("start openFolder");
            console.log(folderPath);
            try {
                const account =
                    msalInstance.getAllAccounts()[0];
                const tokenResponse =
                    await msalInstance.acquireTokenSilent({
                        scopes: ["Files.Read"],
                        account: account
                    });
                const response =
                    await fetch(
                        `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children`,
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    tokenResponse.accessToken
                            }
                        }
                    );
                const data = await response.json();
                displayFiles(data);
            } catch(error) {
                console.error(error);
            }
        }

        function showUser(account) {

            document.getElementById("userInfo").innerHTML =
                `
                <p>ログイン中</p>
                <p>${account.username}</p>
                `;

            document.getElementById("loginButton").style.display =
                "none";

            document.getElementById("logoutButton").style.display =
                "inline";

        }

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length > 0) {

            showUser(accounts[0]);

        }

        document
            .getElementById("loginButton")
            .addEventListener("click", signIn);

        document
            .getElementById("logoutButton")
            .addEventListener("click", signOut);

        document
            .getElementById("listFilesButton")
            .addEventListener("click", listFiles);
    </script>

</body>
</html>
